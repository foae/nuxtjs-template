name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Decides whether this push/PR can affect anything CI actually tests.
    #
    # The filtering deliberately does NOT live in `on: paths-ignore`. GitHub
    # never reports a check for a workflow skipped by path filtering, so a
    # required check stays "Expected — Waiting for status to be reported" and
    # the PR can never merge. Their own docs say not to path-filter a required
    # workflow. A job skipped by `if:` reports Success instead, so the decision
    # has to be a job, not a trigger.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need the base commit to diff against
          persist-credentials: false

      - name: Classify the changed files
        id: filter
        env:
          # On a PR, diff against the base branch tip. On a push to main,
          # against the previous tip.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # Fail open: anything we cannot classify with confidence runs the
          # full suite. Running CI needlessly costs a few minutes; skipping it
          # on a real change costs a broken main.
          run_everything() {
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "$1 — running the full suite." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # All-zeros is a new branch; a rewritten history leaves a SHA that is
          # not in this checkout.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            run_everything 'No base commit to compare against'
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            run_everything "Base commit $BASE is not in this checkout"
          fi

          code_changes=''
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              docs/vendor/*|.agents/skills/nuxt-ui/*)
                # Markdown, but NOT prose as far as CI is concerned. Both trees
                # are generated and every file in them is hashed into a
                # MANIFEST.sha256 that `pnpm verify` checks
                # (scripts/manifest.ts), so a hand-edit here is a CI failure by
                # design — CLAUDE.md rule 13. Must come before the *.md arm.
                code_changes="${code_changes}${file}"$'\n' ;;
              *.md|LICENSE)
                ;; # prose: README, CLAUDE.md/AGENTS.md, docs/decisions, skills
              *)
                code_changes="${code_changes}${file}"$'\n' ;;
            esac
          done <<< "$(git diff --name-only "$BASE" HEAD)"

          if [ -n "$code_changes" ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            {
              echo '### CI running'
              echo 'Files that are not prose:'
              echo '```'
              printf '%s' "$code_changes"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
            {
              echo '### CI skipped — prose-only change'
              echo 'Nothing outside documentation changed, so verify/e2e/docker'
              echo 'have nothing to test. They report Success as skipped jobs.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    # typecheck + lint + unit tests + migration freshness.
    # Needs no database, so it stays fast and is the gate that matters most.
    # This is the same command the agent runs locally — one definition of
    # "done", not a separate CI-only list of checks that can drift.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Verify
        run: pnpm verify

      # `pnpm verify` writes a migration when the schema is stale. It already
      # fails in that case; this also catches untracked files, so any other
      # dirty file is impossible to miss.
      - name: Fail if the working tree is dirty
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo '::error::verify left the working tree dirty (see files above)'
            exit 1
          fi

  e2e:
    # The full stack against a real Postgres.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      NUXT_SESSION_PASSWORD: ci-session-password-at-least-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate
        run: pnpm db:migrate

      # Builds and reseeds by itself (see playwright.config.ts globalSetup), so
      # there is no separate build or seed step to drift out of sync with it.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    # A green CI once coexisted with `docker build .` producing the wrong
    # image (the migrate stage, not the app). CI must build what the README
    # tells people to run.
    #
    # Docs are excluded from the build context (.dockerignore), so a prose
    # change cannot alter the image.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build runtime image (default target)
        run: docker build -t app .

      - name: Build migration image
        run: docker build --target migrate -t app-migrate .

      - name: Default image is the app, not the migrator
        run: |
          test "$(docker inspect app --format '{{join .Config.Cmd " "}}')" = "node .output/server/index.mjs"
          test "$(docker inspect app --format '{{.Config.User}}')" = "app"
          test "$(docker inspect app-migrate --format '{{join .Config.Cmd " "}}')" = "./node_modules/.bin/drizzle-kit migrate"

      - name: Run migrations against the service database
        run: docker run --rm --network host -e DATABASE_URL=postgres://app:app@localhost:5432/app app-migrate

      - name: Boot the runtime image and probe it
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://app:app@localhost:5432/app \
            -e NUXT_SESSION_PASSWORD=ci-session-password-at-least-32-characters \
            app
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          echo '::error::runtime image never answered on :3000'
          docker logs app
          exit 1

  ci:
    # The one job to mark as a required status check in branch protection.
    #
    # Not decorative — it closes a hole the gating job opens. GitHub counts a
    # skipped job as a *successful* required check, and when a job fails its
    # dependents are skipped rather than failed. So if `changes` itself ever
    # failed, verify/e2e/docker would report Success without running and a
    # broken PR would be mergeable. `always()` plus an explicit result check is
    # GitHub's documented remedy for exactly that.
    if: always()
    needs: [changes, verify, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results of every job
        env:
          BAD: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$BAD" = 'true' ]; then
            echo '::error::a CI job failed or was cancelled'
            exit 1
          fi
